
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something Special For You 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #e6d5ff, #ffcce5);
    overflow: hidden;
    padding: 20px;
}

.heart {
    position: fixed;
    bottom: -30px;
    color: rgba(255, 255, 255, 0.75);
    font-size: 22px;
    animation: floatUp 8s linear infinite;
    pointer-events: none;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    20% { opacity: 1; }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

.container {
    width: 100%;
    max-width: 420px;
    text-align: center;
    position: relative;
    z-index: 2;
}

.card {
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.65);
    border-radius: 28px;
    padding: 25px 20px;
    box-shadow: 0 15px 40px rgba(180, 80, 130, 0.18);
    animation: cardIn 0.8s ease;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(25px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.main-image {
    width: 100%;
    max-width: 260px;
    height: 260px;
    object-fit: cover;
    border-radius: 22px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(180, 70, 130, 0.2);
}

h1 {
    color: #d63384;
    font-size: 25px;
    margin-bottom: 10px;
    line-height: 1.5;
}

.subtitle {
    color: #8e4775;
    font-size: 15px;
    margin-bottom: 22px;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    min-height: 55px;
}

button {
    border: none;
    padding: 13px 30px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.25s ease;
    box-shadow: 0 5px 15px rgba(200, 60, 130, 0.2);
}

button:active {
    transform: scale(0.94);
}

.yes-btn {
    background: linear-gradient(135deg, #ff4f9a, #e91e63);
    color: white;
}

.no-btn {
    background: white;
    color: #e91e63;
}

.footer {
    margin-top: 18px;
    color: #a45a85;
    font-size: 12px;
}

/* Open Letter Screen */

#letterScreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #ffd6e7, #e6d5ff, #ffcce5);
    transition: opacity 0.7s ease, visibility 0.7s ease;
}

#letterScreen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.letter-card {
    width: 100%;
    max-width: 370px;
    padding: 35px 25px;
    border-radius: 28px;
    text-align: center;
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 15px 40px rgba(180,80,130,0.2);
    animation: cardIn 0.8s ease;
}

.envelope {
    font-size: 95px;
    display: block;
    margin-bottom: 15px;
    animation: envelopeMove 2s ease-in-out infinite;
}

@keyframes envelopeMove {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-12px) rotate(3deg); }
}

.letter-card h1 {
    font-size: 27px;
}

.letter-card p {
    color: #8e4775;
    font-size: 14px;
    margin: 12px 0 25px;
}

.open-btn {
    color: white;
    background: linear-gradient(135deg, #ff4f9a, #e91e63);
    padding: 14px 30px;
}

/* Music Button */

#musicButton {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 20;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    padding: 0;
    display: none;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    background: rgba(255,255,255,0.8);
    color: #e91e63;
    box-shadow: 0 5px 18px rgba(180,80,130,0.2);
}

/* Success Screen */

.success-title {
    color: #d63384;
    font-size: 24px;
    margin: 15px 0;
}

.success-images {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 15px 0;
}

.success-images img {
    width: 46%;
    height: 180px;
    object-fit: cover;
    border-radius: 18px;
    box-shadow: 0 5px 15px rgba(180,80,130,0.2);
}

.success-message {
    color: #8e4775;
    font-size: 14px;
    line-height: 1.8;
}

/* Confetti */

.confetti {
    position: fixed;
    top: -30px;
    z-index: 30;
    pointer-events: none;
    animation: confettiFall 5s linear forwards;
}

@keyframes confettiFall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

@media(max-width: 380px) {
    .main-image {
        height: 220px;
    }

    h1 {
        font-size: 22px;
    }

    .success-images img {
        height: 150px;
    }
}
</style>
</head>

<body>

<!-- Background Hearts -->
<div id="hearts"></div>

<!-- Music -->
<audio id="backgroundMusic" loop preload="auto">
    <source src="YOUR_MUSIC_URL.mp3" type="audio/mpeg">
</audio>

<!-- Music Toggle -->
<button id="musicButton" onclick="toggleMusic()">🎵</button>

<!-- Open Letter Screen -->
<div id="letterScreen">
    <div class="letter-card">
        <span class="envelope">💌</span>
        <h1>Something Special For You</h1>
        <p>তোমার জন্য ছোট্ট একটা Surprise আছে 💗</p>
        <button class="open-btn" onclick="openLetter()">
            Open My Letter 💗
        </button>
    </div>
</div>

<!-- Main Proposal -->
<div class="container" id="mainContainer">

    <div class="card" id="proposalCard">

        <img
            class="main-image"
            id="mainImage"
            src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgLZJmZuhWCT46oCflW9tIv6l3XQeYwKqPWuEPjZmdCQN4puUM78KJxnDA97SnJtK9OMuuvKvhyphenphenDAgL4qGOL1p6STwFrVX3bIs767c65Qc-BqV4OiBE6tNWIXoQoLOARa_6ukHUsXkxuWN_tVv3rB_ZFXg8QuS40s58Cl0FQNEx3fkELL0WidyEU7zryECR/s736/4860d250b88d1ef7c421cac46d7088d3.jpg"
            alt="Special Image"
        >

        <h1 id="mainText">তুমি আমাকে ভালোবাসো ? 🤗</h1>

        <p class="subtitle" id="subText">
            ~Krish is all yours 💗
        </p>

        <div class="buttons">
            <button class="yes-btn" onclick="yesClicked()">Yes 💗</button>
            <button class="no-btn" id="noButton" onclick="noClicked()">No 🙄</button>
        </div>

        <div class="footer">Made with ♥ by Krish</div>

    </div>
</div>

<script>

/* Background Floating Hearts */

function createHearts() {
    const heartContainer = document.getElementById("hearts");

    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = ["💗", "💕", "💖", "💘", "❤️"][
            Math.floor(Math.random() * 5)
        ];

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (15 + Math.random() * 20) + "px";
        heart.style.animationDuration = (5 + Math.random() * 5) + "s";

        heartContainer.appendChild(heart);

        setTimeout(() => heart.remove(), 10000);
    }, 500);
}

createHearts();


/* Open Letter + Start Music */

const music = document.getElementById("backgroundMusic");
const musicButton = document.getElementById("musicButton");

function openLetter() {

    // Music starts directly from the button click
    music.volume = 0.6;

    const playPromise = music.play();

    if (playPromise !== undefined) {
        playPromise.then(() => {
            musicButton.style.display = "flex";
            musicButton.innerHTML = "🎵";
        }).catch(() => {
            musicButton.style.display = "flex";
            musicButton.innerHTML = "🔇";
        });
    }

    document.getElementById("letterScreen").classList.add("hide");
}


/* Music On / Off */

function toggleMusic() {

    if (music.paused) {
        music.play().then(() => {
            musicButton.innerHTML = "🎵";
        }).catch(() => {
            musicButton.innerHTML = "🔇";
        });
    } else {
        music.pause();
        musicButton.innerHTML = "🔇";
    }
}


/* No Button Logic */

let noCount = 0;

function noClicked() {

    noCount++;

    const image = document.getElementById("mainImage");
    const mainText = document.getElementById("mainText");
    const subText = document.getElementById("subText");
    const noButton = document.getElementById("noButton");

    if (noCount === 1) {

        image.src = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgLZJmZuhWCT46oCflW9tIv6l3XQeYwKqPWuEPjZmdCQN4puUM78KJxnDA97SnJtK9OMuuvKvhyphenhyphenDAgL4qGOL1p6STwFrVX3bIs767c65Qc-BqV4OiBE6tNWIXoQoLOARa_6ukHUsXkxuWN_tVv3rB_ZFXg8QuS40s58Cl0FQNEx3fkELL0WidyEU7zryECR/s736/IMG_20250127_132142.jpg";

        mainText.innerHTML = "একটু ভেবে দেখোনা গো 🙄";
        subText.innerHTML = "এখনি না বলোনা সোনা 😥";

    } else if (noCount === 2) {

        image.src = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgLZJmZuhWCT46oCflW9tIv6l3XQeYwKqPWuEPjZmdCQN4puUM78KJxnDA97SnJtK9OMuuvKvhyphenphenDAgL4qGOL1p6STwFrVX3bIs767c65Qc-BqV4OiBE6tNWIXoQoLOARa_6ukHUsXkxuWN_tVv3rB_ZFXg8QuS40s58Cl0FQNEx3fkELL0WidyEU7zryECR/s736/IMG_20250127_132131.jpg";

        mainText.innerHTML = "আরেকবার ভেবে দেখো please 😣";
        subText.innerHTML = "কেন এরকম করছো 😣";

    } else if (noCount === 3) {

        image.src = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgLZJmZuhWCT46oCflW9tIv6l3XQeYwKqPWuEPjZmdCQN4puUM78KJxnDA97SnJtK9OMuuvKvhyphenphenDAgL4qGOL1p6STwFrVX3bIs767c65Qc-BqV4OiBE6tNWIXoQoLOARa_6ukHUsXkxuWN_tVv3rB_ZFXg8QuS40s58Cl0FQNEx3fkELL0WidyEU7zryECR/s736/41ef11783029f6a2a8f75c4bfc1411f5.jpg";

        mainText.innerHTML = "বাবু এবার তো হ্যা বলো এত্ত ভাব😭";
        subText.innerHTML = "আনেক sad feel হচ্ছে আমার 😭";

    } else {

        noButton.style.position = "fixed";

        const maxX = window.innerWidth - noButton.offsetWidth - 20;
        const maxY = window.innerHeight - noButton.offsetHeight - 20;

        noButton.style.left = Math.max(10, Math.random() * maxX) + "px";
        noButton.style.top = Math.max(10, Math.random() * maxY) + "px";
    }
}


/* Yes Button Logic */

function yesClicked() {

    document.getElementById("mainContainer").innerHTML = `

        <div class="card">

            <div class="success-images">

                <img
                    src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgLZJmZuhWCT46oCflW9tIv6l3XQeYwKqPWuEPjZmdCQN4puUM78KJxnDA97SnJtK9OMuuvKvhyphenhyphenDAgL4qGOL1p6STwFrVX3bIs767c65Qc-BqV4OiBE6tNWIXoQoLOARa_6ukHUsXkxuWN_tVv3rB_ZFXg8QuS40s58Cl0FQNEx3fkELL0WidyEU7zryECR/s736/Picsart_25-01-27_13-37-54-464.png"
                    alt="Celebration"
                >

                <img
                    src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgLZJmZuhWCT46oCflW9tIv6l3XQeYwKqPWuEPjZmdCQN4puUM78KJxnDA97SnJtK9OMuuvKvhyphenphenDAgL4qGOL1p6STwFrVX3bIs767c65Qc-BqV4OiBE6tNWIXoQoLOARa_6ukHUsXkxuWN_tVv3rB_ZFXg8QuS40s58Cl0FQNEx3fkELL0WidyEU7zryECR/s736/d73c53e9a143ecc7fc51690628c7eb24.jpg"
                    alt="Special Moment"
                >

            </div>

            <h1 class="success-title">
                আমি জানতাম তুমি রাজি হবে i love you so much 😘
            </h1>

            <p class="success-message">
                This little moment just became something special! 💗
                <br>
                ~ With love, Krish
            </p>

        </div>
    `;

    createConfetti();
}


/* Celebration Confetti */

function createConfetti() {

    const symbols = ["💗", "💕", "💖", "❤️", "✨", "💘"];

    for (let i = 0; i < 55; i++) {

        const confetti = document.createElement("div");

        confetti.className = "confetti";
        confetti.innerHTML = symbols[
            Math.floor(Math.random() * symbols.length)
        ];

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.fontSize = (15 + Math.random() * 20) + "px";
        confetti.style.animationDuration = (3 + Math.random() * 3) + "s";
        confetti.style.animationDelay = Math.random() * 2 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 6500);
    }
}

</script>

</body>
</html>
